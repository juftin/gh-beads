version: '3'

vars:
  IMAGE: gh-beads:test

env:
  IMAGE: '{{.IMAGE}}'

tasks:
  install:
    desc: Install the locked development environment
    cmds: [uv sync --locked]
  lock:
    desc: Refresh the Python lockfile
    cmds: [uv lock]
  fix:
    desc: Format and fix lint findings
    cmds:
      - uv run --locked ruff check --fix .
      - uv run --locked ruff format .
  lint:
    desc: Check Python and shell formatting and syntax
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - for script in scripts/*.sh; do bash -n "$script" || exit; done
  check:
    desc: Check Python types
    cmds: [uv run --locked mypy]
  test:
    desc: Run token-free reconciliation and integration tests
    cmds: ['uv run --locked pytest {{.CLI_ARGS}}']
  smoke:
    desc: Build and exercise a disposable Dolt, UI, MCP, and synthetic GitHub stack
    cmds: ['bash scripts/smoke.sh {{.IMAGE}}']
  smoke-local:
    desc: Exercise native embedded Dolt, concurrent polling, and stdio in a disposable repository
    cmds: [uv run --locked python tests/smoke_embedded.py]
  smoke-restore:
    desc: Back up a stopped embedded workspace and validate an independent disposable restore
    cmds: [uv run --locked python tests/smoke_restore.py]
  snapshot:
    desc: Show stored portfolio coverage, bounded queues, and saved triage in Compose
    cmds:
      - docker compose exec -T github-reconciler gh-beads-snapshot {{.CLI_ARGS}}
  run:
    desc: Run a command in the project environment
    cmds: ['uv run --locked {{.CLI_ARGS}}']
  build:
    desc: Build the unified image locally
    cmds: ['docker build -t {{.IMAGE}} .']
  package:
    desc: Build the Python source distribution and wheel with uv
    cmds: [uv build --no-sources]
  push:
    desc: Push the explicitly selected image
    cmds: ['docker push {{.IMAGE}}']
  validate:
    desc: Validate Compose configuration without printing injected credentials
    cmds: [docker compose config --quiet]
  deploy:
    desc: Build and start the Compose stack, waiting for healthy services
    deps: [build]
    cmds: [docker compose up -d --wait --wait-timeout 180]
  down:
    desc: Stop the Compose stack and retain its data volume
    cmds: [docker compose down]
  logs:
    desc: Follow Compose service logs
    cmds: ['docker compose logs --follow {{.CLI_ARGS}}']
  sync-now:
    desc: Run one reconciliation in Compose using the shared sync lock
    cmds:
      - docker compose exec -T github-reconciler gh-beads-sync {{.CLI_ARGS}}
  sync-status:
    desc: Show per-repository sync checkpoints, successes, failures, and rate cooldown
    cmds:
      - docker compose exec -T github-reconciler gh-beads-sync --status
  doltlab:setup:
    desc: Download checksum-pinned DoltLab and generate its optional standalone stack
    cmds: [bash scripts/doltlab.sh setup]
  doltlab:validate:
    desc: Validate optional DoltLab Compose configuration without printing passwords
    cmds: [bash scripts/doltlab.sh validate]
  doltlab:deploy:
    desc: Start the optional DoltLab stack independently of the hub
    cmds: [bash scripts/doltlab.sh deploy]
  doltlab:status:
    desc: Show optional DoltLab services
    cmds: [bash scripts/doltlab.sh status]
  doltlab:logs:
    desc: Follow optional DoltLab logs
    cmds: ['bash scripts/doltlab.sh logs {{.CLI_ARGS}}']
  doltlab:down:
    desc: Stop optional DoltLab while retaining its volumes and configuration
    cmds: [bash scripts/doltlab.sh down]
