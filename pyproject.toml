[project]
name = "gh-beads"
version = "0.1.0"
description = "A shared Beads backlog for GitHub issues and pull requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beads-mcp==1.3.1",
    "githubkit>=0.16.1,<0.17",
]

[project.urls]
Repository = "https://github.com/juftin/gh-beads"
Issues = "https://github.com/juftin/gh-beads/issues"

[project.scripts]
gh-beads-sync = "gh_beads.sync:main"
gh-beads-mcp = "gh_beads.mcp:main"
gh-beads-runtime = "gh_beads.runtime:main"
gh-beads-snapshot = "gh_beads.snapshot:main"
gh-beads-triage = "gh_beads.triage:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "pyyaml>=6",
    "types-PyYAML>=6",
    "httpx>=0.28,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
