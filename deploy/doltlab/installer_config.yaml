# Consumed by the pinned upstream installer; runtime passwords come from the environment.
version: v2.6.3
host: "" # Set DOLTLAB_HOST when running task doltlab:setup.
network: gh-beads-doltlab
runtime: docker
use_env: true
metrics_disabled: true
whitelist_all_users: false
services:
  doltlabdb:
    # The installer resolves these variables; use_env keeps values out of generated assets.
    admin_password: "${DOLT_ADMIN_PASSWORD}"
    dolthubapi_password: "${DOLT_DOLTHUBAPI_PASSWORD}"
default_user:
  name: admin
  email: admin@localhost
  password: "${DEFAULT_USER_PASSWORD}"
